<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>heatlossdb – What next?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#17181C}
a{color:#F2994A}a:hover{color:#FFC08A}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #17181C; color: #F2F2F2; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif">
  <header style="height: 68px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: #1E1F23; border-bottom: 1px solid #2C2E33">
    <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true" style="border-radius: 8px"><rect width="100" height="100" fill="#12233B"></rect><polygon points="26,69.5 50,81.5 50,86.5 26,74.5" fill="#24507F"></polygon><polygon points="50,81.5 74,69.5 74,74.5 50,86.5" fill="#1B3F66"></polygon><polygon points="26,69.5 50,57.5 74,69.5 50,81.5" fill="#3B6EA5"></polygon><polygon points="26,49.5 50,61.5 50,66.5 26,54.5" fill="#24507F"></polygon><polygon points="50,61.5 74,49.5 74,54.5 50,66.5" fill="#1B3F66"></polygon><polygon points="26,49.5 50,37.5 74,49.5 50,61.5" fill="#3B6EA5"></polygon><polygon points="26,29.5 50,41.5 50,46.5 26,34.5" fill="#C4621A"></polygon><polygon points="50,41.5 74,29.5 74,34.5 50,46.5" fill="#A04E12"></polygon><polygon points="50,17.5 74,29.5 62,25.5 38,13.5" fill="#F6B97E"></polygon><polygon points="26,29.5 50,41.5 62,25.5 38,13.5" fill="#F2994A"></polygon><polygon points="50,41.5 74,29.5 62,25.5" fill="#A04E12"></polygon></svg>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">heatloss<span style="color: #F2994A">db</span></span>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">

    <section aria-label="Uploaded scan" style="display: flex; flex-wrap: wrap; align-items: center; gap: 24px; padding: 20px 24px; background: #202125; border: 1px solid #2C2E33; border-radius: 14px">
      <div style="width: 168px; height: 112px; flex-shrink: 0; border-radius: 10px; background: #17181C; display: flex; align-items: center; justify-content: center">
        <svg width="144" height="96" viewBox="0 0 144 96" role="img" aria-label="Floor plan preview"><rect x="8" y="8" width="128" height="80" rx="2" fill="none" stroke="#6B8FC0" stroke-width="2.5"></rect><line x1="64" y1="8" x2="64" y2="88" stroke="#6B8FC0" stroke-width="2"></line><line x1="8" y1="48" x2="64" y2="48" stroke="#6B8FC0" stroke-width="2"></line><line x1="64" y1="40" x2="136" y2="40" stroke="#6B8FC0" stroke-width="2"></line><line x1="104" y1="40" x2="104" y2="88" stroke="#6B8FC0" stroke-width="2"></line><line x1="30" y1="48" x2="42" y2="48" stroke="#17181C" stroke-width="3"></line><line x1="64" y1="62" x2="64" y2="74" stroke="#17181C" stroke-width="3"></line></svg>
      </div>
      <div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #7FD3A1">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#7FD3A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 L6.5 12 L13 4.5"></path></svg>
          Scan loaded
        </div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">merged.json</h1>
        <p style="margin: 0; font-size: 15px; color: #A9ADB5">[N] floors · [N] rooms · [AREA] m² floor area</p>
      </div>
      <a href="#" style="font-size: 14px; padding: 12px 4px">Open a different scan</a>
    </section>

    <section aria-labelledby="next-title" style="display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="next-title" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.01em">What next?</h2>
        <p style="margin: 0; font-size: 16px; line-height: 24px; color: #A9ADB5; max-width: 640px">Choose what you’d like to do with your floor plan. You can come back and do the others later.</p>
      </div>

      <div role="radiogroup" aria-label="What next" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px">

        <button type="button" role="radio" aria-checked="{{view.checked}}" onClick="{{view.pick}}" style="text-align: left; cursor: pointer; padding: 24px; min-height: 260px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; color: #F2F2F2; border-radius: 14px; border: {{view.border}}; background: {{view.bg}}">
          <span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: #2A2C31; display: flex; align-items: center; justify-content: center">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12 C4.5 7 8 4.5 12 4.5 C16 4.5 19.5 7 22 12 C19.5 17 16 19.5 12 19.5 C8 19.5 4.5 17 2 12 Z"></path><circle cx="12" cy="12" r="3.5"></circle></svg>
            </span>
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{view.dot}}"></span>
          </span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">View my scan</span>
          <span style="font-size: 15px; line-height: 22px; color: #A9ADB5">Just looking? See your floor plan, rooms and measurements. Nothing is saved or shared.</span>
          <span style="margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: #9CC3F5; background: #1C2A3D">No account needed</span>
        </button>

        <button type="button" role="radio" aria-checked="false" aria-disabled="true" disabled="" style="text-align: left; cursor: not-allowed; padding: 24px; min-height: 260px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; color: #D4D6DB; border-radius: 14px; border: 2px dashed #3A3C42; background: #1C1D21">
          <span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: #2A2C31; display: flex; align-items: center; justify-content: center">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 L21 21"></path><path d="M7.5 11 L10.5 8.5 L13.5 11 V13.5 H7.5 Z"></path></svg>
            </span>
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{search.dot}}"></span>
          </span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Find similar homes</span>
          <span style="font-size: 15px; line-height: 22px; color: #A9ADB5">Match your footprint, age and construction against shared homes, and see their heat loss and heat pump sizing.</span>
          <span style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: #17181C; background: #D4D6DB">Coming soon</span>
            <span style="font-size: 13px; color: #A9ADB5">Opens once enough homes are shared</span>
          </span>
        </button>

        <button type="button" role="radio" aria-checked="{{share.checked}}" onClick="{{share.pick}}" style="text-align: left; cursor: pointer; padding: 24px; min-height: 260px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; color: #F2F2F2; border-radius: 14px; border: {{share.border}}; background: {{share.bg}}">
          <span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: #2A2C31; display: flex; align-items: center; justify-content: center">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 L12 3.5 L21 11"></path><path d="M5.5 9 V20.5 H18.5 V9"></path><path d="M12 17 V10.5"></path><path d="M9.25 13 L12 10.25 L14.75 13"></path></svg>
            </span>
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{share.dot}}"></span>
          </span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Share your home</span>
          <span style="font-size: 15px; line-height: 22px; color: #A9ADB5">Add your floor plan and heat pump details to the database so others with similar homes can learn from it.</span>
          <span style="margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: #F6B97E; background: #3A2614">Free account required</span>
        </button>

        <button type="button" role="radio" aria-checked="false" aria-disabled="true" disabled="" style="text-align: left; cursor: not-allowed; padding: 24px; min-height: 260px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; color: #D4D6DB; border-radius: 14px; border: 2px dashed #3A3C42; background: #1C1D21">
          <span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
            <span style="width: 48px; height: 48px; border-radius: 12px; background: #2A2C31; display: flex; align-items: center; justify-content: center">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#F2994A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 L9 4 L15 6.5 L21 4 V17.5 L15 20 L9 17.5 L3 20 Z"></path><path d="M9 4 V17.5"></path><path d="M15 6.5 V20"></path></svg>
            </span>
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{explore.dot}}"></span>
          </span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Explore the database</span>
          <span style="font-size: 15px; line-height: 22px; color: #A9ADB5">Browse shared homes by area, age and property type, and compare how their heat pumps perform.</span>
          <span style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: #17181C; background: #D4D6DB">Coming soon</span>
            <span style="font-size: 13px; color: #A9ADB5">Opens once enough homes are shared</span>
          </span>
        </button>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 8px; border-top: 1px solid #2C2E33">
        <p style="margin: 16px 0 0; font-size: 14px; line-height: 20px; color: #A9ADB5; max-width: 560px">{{hint}}</p>
        <button type="button" style="margin-top: 16px; cursor: pointer; padding: 12px 22px; min-height: 46px; font-size: 16px; color: #FFFFFF; background: #C8692A; border: none; border-radius: 8px; display: flex; align-items: center; gap: 10px">{{cta}}
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19"></path><path d="M13 6 L19 12 L13 18"></path></svg>
        </button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'share' };
  }
  renderVals() {
    const picked = this.state.picked;
    const opt = (id) => {
      const on = picked === id;
      return {
        checked: on ? 'true' : 'false',
        pick: () => this.setState({ picked: id }),
        border: on ? '2px solid #E07B35' : '2px solid #2C2E33',
        bg: on ? '#26221F' : '#202125',
        dot: on ? '7px solid #E07B35' : '2px solid #5A5D65'
      };
    };
    const hints = {
      view: 'Your scan stays in this browser only. You can search or share it later.',
      search: 'Next, a few quick questions about your home: postcode, age and type, and how it’s built.',
      share: 'Next, a few quick questions about your home. You’ll create a free account before your floor plan is saved.',
      explore: 'Your scan stays loaded, so you can search or share it at any point.'
    };
    const ctas = { view: 'View floor plan', search: 'Continue', share: 'Continue', explore: 'Start exploring' };
    return {
      view: opt('view'),
      search: opt('search'),
      share: opt('share'),
      explore: opt('explore'),
      hint: hints[picked],
      cta: ctas[picked]
    };
  }
}
</script>
</body>
</html>
