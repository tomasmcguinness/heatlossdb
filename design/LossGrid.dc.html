<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C – Heat-Loss Grid</title>

</head>
<body>
<x-dc>
<helmet>

<style>

</helmet>

    </div>
    <div style="background: #1F2430; border-radius: 20px; padding: 36px 40px; display: flex; align-items: center; gap: 20px; color: #F6F3EE">

    </div>
    <div style="display: flex; gap: 32px; align-items: flex-end; padding: 8px 4px 0">
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
        <div style="width: 120px; height: 120px; border-radius: 27px; overflow: hidden">
          <svg width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="{{iconBg}}"></rect><polygon points="24,38 50,14 76,38" fill="{{roof}}" stroke="{{roof}}" stroke-width="3" stroke-linejoin="round"></polygon><rect x="27.5" y="42" width="13" height="13" rx="2.5" fill="#EE7B30"></rect><rect x="43.5" y="42" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="59.5" y="42" width="13" height="13" rx="2.5" fill="#B9461A"></rect><rect x="27.5" y="58" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect><rect x="43.5" y="58" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="59.5" y="58" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="27.5" y="74" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="43.5" y="74" width="13" height="13" rx="2.5" fill="#1D4E89"></rect><rect x="59.5" y="74" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect></svg>

        <div style="width: 64px; height: 64px; border-radius: 14px; overflow: hidden">
          <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="{{iconBg}}"></rect><polygon points="24,38 50,14 76,38" fill="{{roof}}" stroke="{{roof}}" stroke-width="3" stroke-linejoin="round"></polygon><rect x="27.5" y="42" width="13" height="13" rx="2.5" fill="#EE7B30"></rect><rect x="43.5" y="42" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="59.5" y="42" width="13" height="13" rx="2.5" fill="#B9461A"></rect><rect x="27.5" y="58" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect><rect x="43.5" y="58" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="59.5" y="58" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="27.5" y="74" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="43.5" y="74" width="13" height="13" rx="2.5" fill="#1D4E89"></rect><rect x="59.5" y="74" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect></svg>

      <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
        <div style="width: 32px; height: 32px; border-radius: 7px; overflow: hidden">
          <svg width="32" height="32" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="{{iconBg}}"></rect><polygon points="24,38 50,14 76,38" fill="{{roof}}" stroke="{{roof}}" stroke-width="3" stroke-linejoin="round"></polygon><rect x="27.5" y="42" width="13" height="13" rx="2.5" fill="#EE7B30"></rect><rect x="43.5" y="42" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="59.5" y="42" width="13" height="13" rx="2.5" fill="#B9461A"></rect><rect x="27.5" y="58" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect><rect x="43.5" y="58" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="59.5" y="58" width="13" height="13" rx="2.5" fill="#F7C59F"></rect><rect x="27.5" y="74" width="13" height="13" rx="2.5" fill="#5B8FD6"></rect><rect x="43.5" y="74" width="13" height="13" rx="2.5" fill="#1D4E89"></rect><rect x="59.5" y="74" width="13" height="13" rx="2.5" fill="#BFD3EE"></rect></svg>
        </div>
        <span style="font-size: 13px; color: #4F5563">32</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"darkIcon":{"editor":"boolean","default":false},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.darkIcon ?? false;
    return { iconBg: dark ? '#1F2430' : '#F6F3EE', roof: dark ? '#F6F3EE' : '#1F2430' };
  }
}
</script>
