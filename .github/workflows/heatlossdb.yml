name: Build and deploy .NET Core application to Web App heatlossdb
on:
  push:
    branches:
    - scan-viewer-and-upload
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: heatlossdb
  AZURE_WEBAPP_PACKAGE_PATH: published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  SOLUTION: Api/HeatLossDB.sln
  API_PROJECT: Api/HeatLossDB.Api/HeatLossDB.Api.csproj
jobs:
  build:
    environment: heatlossdb_Env
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.SOLUTION }}"
    - name: Build
      run: dotnet build "${{ env.SOLUTION }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    # The tests run against the storage emulator.
    - name: Start Azurite
      run: npx --yes azurite@3.37.0 --silent --inMemoryPersistence --skipApiVersionCheck &
    - name: Test
      run: dotnet test "${{ env.SOLUTION }}" --configuration ${{ env.CONFIGURATION }} --no-build
    - name: Publish
      run: dotnet publish "${{ env.API_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: heatlossdb_Env
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.heatlossdb_CLIENT_ID_8B79 }}
        tenant-id: ${{ vars.heatlossdb_TENANT_ID_8B79 }}
        subscription-id: ${{ vars.heatlossdb_SUBSCRIPTION_ID_8B79 }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
